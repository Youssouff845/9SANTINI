<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFLEG-SLS9 GRAND FINALS · موسع</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .control-panel {
            background: #1f2937;
            padding: 20px;
            border-radius: 12px;
            margin: 20px;
            width: 90%;
            max-width: 1400px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
            border: 1px solid #374151;
            z-index: 10;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #374151;
            padding: 8px 15px;
            border-radius: 8px;
        }
        .file-upload-wrapper input[type="file"] {
            color: #ffffff;
            cursor: pointer;
        }
        
        .btn-capture {
            background: #fbbf24;
            border: none;
            color: black;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-capture:hover { background: #f59e0b; }

        .btn-remove-bg {
            background: #ef4444;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-remove-bg:hover { background: #dc2626; }

        #dashboardCanvas {
            width: 1920px;
            height: 1080px;
            background-color: #0d1117;
            position: relative;
            padding: 40px 60px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform-origin: top left;
            overflow: hidden;
        }

        #canvasBackground {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.8;
            display: none;
        }

        .header-title, .columns-wrapper, .rounds-history-section {
            position: relative;
            z-index: 1;
        }

        .header-title {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px solid #fbbf24;
            padding-bottom: 10px;
        }
        .header-title h1 {
            margin: 0;
            color: #fbbf24;
            font-size: 44px;          /* تكبير العنوان */
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .columns-wrapper {
            display: flex;
            gap: 30px;
            flex: 1;
            width: 100%;
        }
        
        .col-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .table-header {
            display: flex;
            width: 100%;
            padding: 12px 10px;
            border-bottom: 2px solid #fbbf24;
            color: #fbbf24;
            font-weight: bold;
            font-size: 16px;           /* تكبير رأس الجدول */
            letter-spacing: 1.5px;
            text-align: center;
            background: rgba(0,0,0,0.6);
            border-radius: 12px 12px 0 0;
            text-shadow: 1px 1px 2px #000;
        }

        .team-row {
            display: flex;
            align-items: center;
            width: 100%;
            background: rgba(20, 30, 40, 0.85);
            border-radius: 12px;
            padding: 10px 12px;        /* زيادة الحشو الداخلي */
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            height: 58px;              /* زيادة ارتفاع الصف */
        }
        .team-row:hover { border-color: #fbbf24; }

        .col-rank { 
            width: 45px; 
            color: #fbbf24; 
            font-size: 20px;           /* تكبير الرقم */
            font-weight: bold; 
            text-align: left; 
            padding-left: 5px; 
        }
        .col-team { 
            flex: 2; 
            display: flex; 
            align-items: center; 
            gap: 14px;                /* مسافة أكبر بين اللوجو والاسم */
            padding-left: 8px; 
        }
        .col-team .team-logo { 
            width: 42px;               /* تكبير اللوجو */
            height: 42px; 
            object-fit: contain; 
            border-radius: 50%; 
            background: #0a0a0a; 
            border: 2px solid #fbbf24;
            padding: 2px;
        }
        .col-team .team-name { 
            font-weight: bold; 
            font-size: 20px;           /* تكبير اسم الفريق */
            letter-spacing: 1px; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }
        
        .col-stat { 
            width: 80px;               /* زيادة العرض */
            text-align: center; 
            font-size: 20px;           /* تكبير الأرقام */
            font-weight: bold; 
            color: #ffffff; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .col-total { 
            width: 80px; 
            text-align: center; 
            font-size: 22px;           /* تكبير TOTAL */
            font-weight: bold; 
            color: #fbbf24; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .col-booyah { 
            width: 80px; 
            text-align: center; 
            font-size: 22px;           /* تكبير BOOYAH */
            font-weight: bold; 
            color: #fbbf24; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* قسم الجولات - BOOYAH HISTORY */
        .rounds-history-section {
            margin-top: 24px;
            border-top: 2px solid #fbbf24;
            padding-top: 20px;
            width: 100%;
        }
        .rounds-grid {
            display: flex;
            width: 100%;
            height: 125px;             /* زيادة الارتفاع قليلاً */
            background-color: rgba(101, 67, 33, 0.9);
            border: 2px solid #654321;
        }
        .round-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px solid #ffffff;
            position: relative;
            padding: 8px 6px;
            background-color: rgba(0,0,0,0.3);
        }
        .round-box:last-child { border-right: none; }

        .round-label {
            color: #ffffff;
            font-size: 19px;           /* تكبير رقم الجولة */
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-bottom: 4px;
        }
        .round-logo-container {
            width: 68px;               /* تكبير حاوية اللوجو */
            height: 68px;
            background-color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fbbf24;
        }
        .round-logo-container img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .booyah-history-box {
            flex: 1.5;
            display: flex;
            align-items: center;        /* توسيط عمودي */
            justify-content: center;
            background-color: rgba(0,0,0,0.3);
            border-left: 2px solid #ffffff;
            padding: 0 10px;
        }
        .booyah-history-text {
            font-family: 'Impact', 'Arial Narrow', sans-serif;
            color: #ffffff;
            font-size: 48px;           /* تكبير BOOYAH HISTORY */
            letter-spacing: 4px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .booyah-history-text span:first-child {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <div class="file-upload-wrapper">
            <span>📂 رفع ملف Log (اختر جميع الجولات):</span>
            <input type="file" id="logFileInput" accept=".txt,.log" multiple>
        </div>
        
        <div class="file-upload-wrapper">
            <span>🖼️ رفع خلفية:</span>
            <input type="file" id="bgFileInput" accept=".png,.jpg,.jpeg,.gif,.webp">
        </div>
        
        <button class="btn-remove-bg" onclick="removeBackground()">🗑️ إزالة الخلفية</button>
        <button class="btn-capture" onclick="takeScreenshot()">📸 تنزيل الصورة (1920x1080)</button>
    </div>

    <div id="dashboardCanvas">
        <img id="canvasBackground" alt="Background">
        
        <div class="header-title">
            <h1>FFLEG-SLS9- GRAND FINALS - CHAMPION RUSH</h1>
        </div>

        <div class="columns-wrapper">
            <div class="col-side">
                <div class="table-header">
                    <div class="col-rank">#</div>
                    <div class="col-team">TEAM NAME</div>
                    <div class="col-stat">ELIMS</div>
                    <div class="col-stat">TOP</div>
                    <div class="col-total">TOTAL</div>
                    <div class="col-booyah">BOOYAH</div>
                </div>
                <div id="leftRows"></div>
            </div>
            <div class="col-side">
                <div class="table-header">
                    <div class="col-rank">#</div>
                    <div class="col-team">TEAM NAME</div>
                    <div class="col-stat">ELIMS</div>
                    <div class="col-stat">TOP</div>
                    <div class="col-total">TOTAL</div>
                    <div class="col-booyah">BOOYAH</div>
                </div>
                <div id="rightRows"></div>
            </div>
        </div>

        <div class="rounds-history-section">
            <div class="rounds-grid" id="roundsGrid"></div>
        </div>

    </div>

<script>
    const teams = [
      { id: 1, name: "WASK TEAM", fullNames: ["WASK", "WASK TEAM"], logo: "./logos/wask.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 2, name: "XPROJEKT ESP", fullNames: ["XP", "XPROJEKT"], logo: "./logos/xp.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 3, name: "AHLI ESP", fullNames: ["AHL", "AHLI ESP"], logo: "./logos/ahl.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 4, name: "ALLIANCE DZ", fullNames: ["AL", "ALLIANCE"], logo: "./logos/al.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 5, name: "BACK2REVENGE", fullNames: ["B2R", "BACK2REVENGE"], logo: "./logos/b2r.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 6, name: "CLEAR VISION", fullNames: ["CLVS", "CLEAR VISION"], logo: "./logos/clvs.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 7, name: "GG ESPORTS", fullNames: ["GG", "GG ESPORTS"], logo: "./logos/gg.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 8, name: "HELL TEAM", fullNames: ["HELL"], logo: "./logos/hell.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 9, name: "HUNTERS ESPORTS", fullNames: ["HNT", "HUNTERS"], logo: "./logos/hnt.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 10, name: "JOKO FORCE", fullNames: ["JF", "JOKO FORCE"], logo: "./logos/jf.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 11, name: "MALOS TEAM", fullNames: ["MALOS"], logo: "./logos/malos.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 12, name: "NEXE ESPORTS", fullNames: ["NEXE", "NEXE ESPORT"], logo: "./logos/nexe.png", elims: 0, top: 0, total: 0, booyah: 0 },
      { id: 13, name: "VOLCANOS", fullNames: ["VLCN", "VOLCANOS"], logo: "./logos/vlcn.png", elims: 0, top: 0, total: 0, booyah: 0 }
    ];

    const DEFAULT_ROUND_LOGO = "./default_round_logo.png";
    let roundWinnersLogos = {};

    document.getElementById('bgFileInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const bgElement = document.getElementById('canvasBackground');
            bgElement.src = e.target.result;
            bgElement.style.display = 'block';
        };
        reader.readAsDataURL(file);
    });

    function removeBackground() {
        const bgElement = document.getElementById('canvasBackground');
        bgElement.style.display = 'none';
        bgElement.src = '';
        document.getElementById('bgFileInput').value = '';
    }

    function buildTables() {
        const leftRows = document.getElementById('leftRows');
        const rightRows = document.getElementById('rightRows');
        leftRows.innerHTML = '';
        rightRows.innerHTML = '';

        const sortedTeams = [...teams].sort((a, b) => b.total - a.total);
        const leftTeams = sortedTeams.slice(0, 7);
        const rightTeams = sortedTeams.slice(7, 13);

        function createRow(team, rank) {
            const row = document.createElement('div');
            row.className = 'team-row';
            row.innerHTML = `
                <div class="col-rank">#${rank}</div>
                <div class="col-team">
                    <img src="${team.logo}" alt="${team.name}" class="team-logo" onerror="this.remove()">
                    <span class="team-name">${team.name}</span>
                </div>
                <div class="col-stat">${team.elims}</div>
                <div class="col-stat">${team.top}</div>
                <div class="col-total">${team.total}</div>
                <div class="col-booyah">${team.booyah}</div>
            `;
            return row;
        }

        leftTeams.forEach((team, index) => leftRows.appendChild(createRow(team, index + 1)));
        rightTeams.forEach((team, index) => rightRows.appendChild(createRow(team, index + 8)));
    }

    function buildRounds() {
        const grid = document.getElementById('roundsGrid');
        grid.innerHTML = '';
        for (let i = 1; i <= 8; i++) {
            const box = document.createElement('div');
            box.className = 'round-box';
            const logo = roundWinnersLogos[i] || DEFAULT_ROUND_LOGO;
            box.innerHTML = `
                <div class="round-label">الجولة ${i}</div>
                <div class="round-logo-container">
                    <img src="${logo}" alt="Round ${i} Winner" onerror="this.src='${DEFAULT_ROUND_LOGO}'">
                </div>
            `;
            grid.appendChild(box);
        }
        const historyBox = document.createElement('div');
        historyBox.className = 'booyah-history-box';
        historyBox.innerHTML = `
            <div class="booyah-history-text">
                <span>BOOYAH</span>
                <span>HISTORY</span>
            </div>
        `;
        grid.appendChild(historyBox);
    }

    buildTables();
    buildRounds();

    document.getElementById('logFileInput').addEventListener('change', function(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        teams.forEach(t => { t.elims = 0; t.top = 0; t.total = 0; t.booyah = 0; });
        roundWinnersLogos = {};
        let processedFiles = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const fileName = file.name.toLowerCase();
            let roundNumber = 0;
            const match = fileName.match(/room(\d+)/);
            if (match) roundNumber = parseInt(match[1]);
            if (roundNumber < 1) continue;

            const reader = new FileReader();
            reader.onload = (function(roundNum) {
                return function(e) {
                    const contents = e.target.result;
                    const lines = contents.split('\n');
                    let winnerTeam = null;

                    lines.forEach(line => {
                        const cleanLine = line.trim();
                        if (cleanLine.startsWith("TeamName:")) {
                            const teamMatch = cleanLine.match(/TeamName:\s*(\w+)/i);
                            const rankMatch = cleanLine.match(/Rank:\s*(\d+)/i);
                            const killMatch = cleanLine.match(/KillScore:\s*(\d+)/i);
                            const totalMatch = cleanLine.match(/TotalScore:\s*(\d+)/i);
                            if (teamMatch && rankMatch && killMatch && totalMatch) {
                                const extractedName = teamMatch[1].toUpperCase();
                                const rank = parseInt(rankMatch[1]);
                                const elims = parseInt(killMatch[1]);
                                const total = parseInt(totalMatch[1]);
                                let topScore = 0;
                                if (rank === 1) topScore = 12;
                                else if (rank === 2) topScore = 9;
                                else if (rank === 3) topScore = 8;
                                else if (rank === 4) topScore = 7;
                                else if (rank === 5) topScore = 6;
                                else if (rank === 6) topScore = 5;
                                else if (rank === 7) topScore = 4;
                                else if (rank === 8) topScore = 3;
                                else if (rank === 9) topScore = 2;
                                else if (rank === 10) topScore = 1;
                                let matchedTeam = null;
                                for (let t of teams) {
                                    if (t.name === extractedName || t.fullNames.includes(extractedName)) {
                                        matchedTeam = t; break;
                                    }
                                }
                                if (matchedTeam) {
                                    matchedTeam.elims += elims;
                                    matchedTeam.top += topScore;
                                    matchedTeam.total += total;
                                    if (rank === 1) {
                                        matchedTeam.booyah += 1;
                                        winnerTeam = matchedTeam;
                                    }
                                }
                            }
                        }
                    });
                    if (winnerTeam && roundNum >= 1 && roundNum <= 8) roundWinnersLogos[roundNum] = winnerTeam.logo;
                    processedFiles++;
                    if (processedFiles === files.length) {
                        buildTables();
                        buildRounds();
                    }
                };
            })(roundNumber);
            reader.readAsText(file);
        }
    });

    function takeScreenshot() {
        const canvasElement = document.getElementById('dashboardCanvas');
        
        if (typeof html2canvas === 'undefined') {
            alert('خطأ: مكتبة التصوير لم يتم تحميلها. تأكد من اتصالك بالإنترنت.');
            return;
        }

        html2canvas(canvasElement, {
            scale: 1,
            useCORS: true,
            backgroundColor: null,
            logging: false,
            allowTaint: false
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'FFLEG-SLS9-Grand-Finals.png';
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }).catch(err => {
            console.error('خطأ في التصوير:', err);
            alert('حدث خطأ في التصوير. تأكد من فتح الملف عبر Ctrl+O في المتصفح.');
        });
    }
</script>

</body>
</html>
